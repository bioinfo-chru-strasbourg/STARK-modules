
services:

    stark-module-qualitycontrol-submodule-cqi-service-cli:
        image: stark/stark-module-qualitycontrol-submodule-cqi-service-cli:1.1
        build:
            context: ./
            dockerfile: cqi_dockerfile
        container_name: stark-module-qualitycontrol-submodule-cqi-service-cli
        restart: "no"
        entrypoint: ["/bin/bash", "-c"]
        command: ["tail -f /dev/null"]  
        tty: true
        stdin_open: true
        volumes:
            - /home1/data/STARK/output/repository:/output/repository:rw
            - /home1/data/STARK/output/depository:/output/depository:rw
            - /home1/data/STARK/databases:/databases:ro
            - /home1/data/STARK/services/qualitycontrol/cqi:/services/qualitycontrol/cqi:rw
            - /home1/data/STARK/config/qualitycontrol/cqi:/config/qualitycontrol/cqi:ro
        networks:
            - stark_stark

    stark-module-qualitycontrol-submodule-cqi-service-listener:
        image: stark/stark-module-common-submodule-listener-service-listener:2.0
        container_name: stark-module-qualitycontrol-submodule-cqi-service-listener
        entrypoint: "python3"
        command: "/app/bin/listener.py --input=/output/repository --json=/config/qualitycontrol/cqi/listener/cqi.json --config=/config/qualitycontrol/cqi/listener/cqi.conf --servicename=CQI --containersfile=/services/qualitycontrol/cqi/listener --nbDaysBack=30 --minDelay=1"
        restart: always
        environment:
            - DOCKER_STARK_MODULE_SUBMODULE_INNER_FOLDER_CONFIG=/config/qualitycontrol/cqi
        volumes:
            - /home1/data/STARK/output/repository:/output/repository:rw
            - /home1/data/STARK/output/depository:/output/depository:rw
            - /home1/data/STARK/databases:/databases:ro
            - /home1/data/STARK/services/qualitycontrol/cqi:/services/qualitycontrol/cqi:rw
            - /home1/data/STARK/config/qualitycontrol/cqi:/config/qualitycontrol/cqi:ro
            - /home1/data/STARK/config/qualitycontrol/cqi/listener/launcher.py:/app/bin/config/launcher.py:ro
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - stark_stark

networks:
    stark_stark:
        external: true
